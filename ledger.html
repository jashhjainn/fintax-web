<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FINTAX • Ledger</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="siteHeader" data-include="partials/header.html"></div>

  <main class="main" id="main" role="main">
    <section class="card">
      <h1 class="title">Ledger</h1>
      <p class="subtitle">OCR results from your uploads.</p>
      <div class="actions" style="margin-top:12px; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <label for="financialYear" style="font-weight: 600; color: var(--text);">Financial Year:</label>
          <select id="financialYear" class="btn outline" style="padding: 8px 12px; border-radius: 6px; background: var(--bg); color: var(--text); border: 1px solid var(--muted);">
            <option value="all">All Years</option>
            <option value="2020">2019-2020</option>
            <option value="2021">2020-2021</option>
            <option value="2022">2021-2022</option>
            <option value="2023">2022-2023</option>
            <option value="2024">2023-2024</option>
            <option value="2025">2024-2025</option>
            <option value="2026">2025-2026</option>
            <option value="2027">2026-2027</option>
            <option value="2028">2027-2028</option>
            <option value="2029">2028-2029</option>
            <option value="2030">2029-2030</option>
          </select>
          <label for="monthFilter" style="font-weight: 600; color: var(--text);">Month:</label>
          <select id="monthFilter" class="btn outline" style="padding: 8px 12px; border-radius: 6px; background: var(--bg); color: var(--text); border: 1px solid var(--muted);">
            <option value="all">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <button class="btn outline" id="downloadLedgerPdf" type="button">
            <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
            Download PDF
          </button>
        </div>
      </div>
    </section>

    <section class="card" id="ledgerRoot" aria-live="polite">
      <div class="subtitle" id="ledgerStatus">Loading OCR results…</div>
      <div class="table-wrap" style="overflow:auto;margin-top:12px;">
        <table class="ledger-table" id="ledgerTable" aria-label="Ledger table">
          <thead>
            <tr>
              <th class="col-preview">Preview</th>
              <th>Srno</th>
              <th>Bill No</th>
              <th>Particulars</th>
              <th>GST Payable</th>
              <th>Total Amt</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="ledgerImageModal" class="modal" aria-hidden="true" role="dialog" aria-label="Invoice preview">
    <div class="modal-content ledger-image-modal">
      <button type="button" class="close-btn" id="ledgerImageClose" aria-label="Close preview">×</button>
      <img id="ledgerImageFull" src="" alt="Invoice preview">
    </div>
  </div>

  <div id="siteNav" data-include="partials/nav.html"></div>

  <script src="script.js" defer></script>
</body>
</html>
