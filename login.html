<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINTAX | Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <script defer src="script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <main id="main" class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title" class="login-title">Log in</h1>

      <form class="login-form" id="loginForm" action="#" method="post">
        <label class="login-label" for="loginEmail">Email</label>
        <input class="login-input" id="loginEmail" name="email" type="email" autocomplete="email" required />

        <label class="login-label" for="loginPassword">Password</label>
        <div class="login-password">
          <input class="login-input" id="loginPassword" name="password" type="password" autocomplete="current-password" required />
          <button class="login-eye" type="button" aria-label="Show password" title="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>

        <button class="login-btn" type="submit">Log In</button>
      </form>

      <p class="login-alt">New here? <a class="login-link" href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
