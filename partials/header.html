<a class="skip-link visually-hidden-focusable" href="#main">Skip to main content</a>
<header class="app-header" role="banner">
  <div class="brand"><a href="home.html" class="brand-link">FINTAX</a></div>
  <div class="header-actions">
    <button type="button" id="aboutUsBtn" class="header-about-btn" aria-haspopup="dialog" aria-expanded="false" hidden>About Us</button>
    <button type="button" id="themeToggle" aria-pressed="false" aria-label="Toggle theme" title="Toggle theme"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
    <button type="button" id="logoutBtn" class="btn outline" aria-label="Logout" title="Logout"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i></button>
  </div>
  <div id="globalStatus" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</header>

<!-- Logout Confirmation Modal -->
<div id="logoutModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">
  <div class="logout-modal" role="document">
    <div class="logout-header">
      <div class="logout-header-content">
        <div class="logout-icon">
          <i class="fa-solid fa-sign-out-alt"></i>
        </div>
        <h2 id="logoutTitle" class="logout-title">Logout Confirmation</h2>
      </div>
      <button type="button" class="logout-close" id="closeLogoutModal" aria-label="Close">
        <i class="fa-solid fa-times"></i>
      </button>
    </div>
    <div class="logout-body">
      <div class="logout-body-content">
        <div class="logout-icon-large">
          <i class="fa-solid fa-sign-out-alt"></i>
        </div>
        <div class="logout-message">
          Are you sure you want to logout?
        </div>
        <div class="logout-subtitle">
          <!-- You will be redirected to the login page. -->
        </div>
      </div>
    </div>
    <div class="logout-footer">
      <button type="button" class="btn outline" id="cancelLogoutBtn">Cancel</button>
      <button type="button" class="btn primary" id="confirmLogoutBtn">Logout</button>
    </div>
  </div>
</div>
