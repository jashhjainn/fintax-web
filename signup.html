<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINTAX | Sign Up</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="signup.css" />
  <script defer src="script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <main id="main" class="signup-shell">
    <section class="signup-card" aria-labelledby="signup-title">
      <h1 id="signup-title" class="signup-title">sign up</h1>
      <p class="signup-subtitle"></p>

      <form class="signup-form" id="signupForm" action="#" method="post">
        <label class="signup-label" for="signupName">Full Name</label>
        <input class="signup-input" id="signupName" name="name" type="text" autocomplete="name" required />

        <label class="signup-label" for="signupEmail">Email</label>
        <input class="signup-input" id="signupEmail" name="email" type="email" autocomplete="email" required />

        <label class="signup-label" for="signupPassword">Password</label>
        <div class="signup-password">
          <input class="signup-input" id="signupPassword" name="password" type="password" autocomplete="new-password" required />
          <button class="signup-eye" type="button" aria-label="Show password" title="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>

        <label class="signup-label" for="signupConfirmPassword">Confirm Password</label>
        <div class="signup-password">
          <input class="signup-input" id="signupConfirmPassword" name="confirm_password" type="password" autocomplete="new-password" required />
          <button class="signup-eye" type="button" aria-label="Show password" title="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>

        <button class="signup-btn" type="submit">Sign Up</button>
      </form>

      <p class="signup-alt">Already have an account? <a class="signup-link" href="login.html">Log in</a></p>

      <!-- <div class="signup-or">
        <span></span>
        <p>or</p>
        <span></span>
      </div> 
      
      <button class="signup-google" type="button">
        <span class="g-badge">G</span>
        Continue with Google
      </button> -->
      
    </section>
  </main>
</body>
</html>
